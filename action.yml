name: "Prepare Archivatorium vault"
description: "Generates the server-rendered Archivatorium application inside an Obsidian vault"

inputs:
  vault:
    description: "Path to the Obsidian vault"
    required: true
    default: "."
  config:
    description: "Path to the configuration file"
    required: false
  version:
    description: "Version of the plugin"
    required: false
    default: "latest"
    
outputs:
  output:
    description: "Path to the generated hidden server directory"
    value: ${{ steps.run-docker.outputs.output }}
    
runs:
  using: "composite"
  
  steps:
    - name: Run docker container
      id: run-docker
      shell: bash
    
      run: |
        set +e

        if [ -z "${{ inputs.config }}" ]; then
          docker run --rm -v "${{ inputs.vault }}:/vault" ghcr.io/honzas83/archivatorium-web-export:${{ inputs.version }} >> ./.log.txt
        else
          docker run --rm -v "${{ inputs.vault }}:/vault" -v "${{ inputs.config }}:/config.json:ro" ghcr.io/honzas83/archivatorium-web-export:${{ inputs.version }} >> ./.log.txt
        fi
        status=$?

        cat ./.log.txt
        echo "output=${{ inputs.vault }}/.archivatorium" >> "$GITHUB_OUTPUT"

        if [ "$status" -eq 137 ]; then
          exit 0
        fi
        exit "$status"
